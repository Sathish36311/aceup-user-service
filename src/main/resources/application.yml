
+server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: aceup-user-service

  datasource:
    url: jdbc:postgresql://localhost:5432/aceup_dev
    username: postgres
    password: Password@123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update    # change to validate or none in prod
    show-sql: true
    properties:
      hibernate:
        '[format_sql]': true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  # Redis Configuration
  cache:
    type: redis
  data:
    redis:
      host: localhost
      port: 6379

logging:
  level:
    root: INFO
    '[org.springframework.web]': DEBUG
    '[com.aceup]': DEBUG
    '[org.springframework.cache]': DEBUG
    '[org.springframework.cache.interceptor]': DEBUG
  file:
    name: logs/aceup-user-service.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Swagger/OpenAPI config (via springdoc-openapi)
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    display-request-duration: true

# JWT Configuration (Optional, if you want to keep it configurable)
jwt:
  secret: Pz9gK9L3+r5mHo3avYj+PkUJYzMEY7szFja6GKvJ9Bs=
#  expiration: 600000 # 10 mins in milliseconds
  access-expiration: 120000
#  refresh-expiration: 604800000  # 7 days
  refresh-expiration: 240000

# Enable actuator endpoints (optional monitoring)
management:
  endpoints:
    web:
      exposure:
        include: "*"


